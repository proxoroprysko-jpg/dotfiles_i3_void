# ============================================================================
# КОНФИГУРАЦИЯ ШРИФТОВ (IOSEVKA NERD FONT)
# ============================================================================
font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Размер шрифта (меняй под себя, 11-12 для Iosevka обычно идеально)
font_size 11.0

# Отключение принудительного размытия пикселей шрифта (делает текст четче)
anti_alias yes

# ============================================================================
# ДИЗАЙН И ПРОЗРАЧНОСТЬ ОКНА
# ============================================================================
# Прозрачность фона (0.85 — легкая прозрачность, обои будет видно)
background_opacity 0.85

# Размытие заднего плана (работает, если композитор Picom это поддерживает)
background_blur 1

# Отступы внутри терминала, чтобы текст не прилипал к краям экрана
window_padding_width 8

# Убираем системные рамки самого окна Kitty, так как у нас тайлинг в i3
hide_window_decorations yes

# Форма курсора (beam — вертикальная палочка, block — квадрат)
cursor_shape beam
cursor_blink_interval 0.5

# ============================================================================
# НАСТРОЙКИ СКОРОСТИ И ПРОТОКОЛОВ (КРИТИЧНО ДЛЯ КАРТИНОК)
# ============================================================================
# Включаем поддержку графического протокола на максимум (для fastfetch)
allow_remote_control yes
listen_on unix:@mykitty

# Частота обновления экрана и отклик (минимизирует задержки ввода)
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Отключаем бесячий системный писк (динамик) при ошибках
enable_audio_bell no

# ============================================================================
# ЦВЕТОВАЯ СХЕМА (ПОД СЕРО-СИНИЙ СТИЛЬ VOID / GOJIRA)
# ============================================================================
background #1e242b
foreground #d1d7e0

# Черный и серый
color0 #29313a
color8 #3b4552

# Красный (ошибки)
color1 #fb4934
color9 #fb4934

# Зеленый (для Void)
color2 #4c7a5d
color10 #639a79

# Желтый
color3 #fabd2f
color11 #fabd2f

# Синий / Голубой
color4 #458588
color12 #83a598

# Пурпурный
color5 #d3869b
color13 #d3869b

# Циановый (бирюзовый)
color6 #8ec07c
color14 #8ec07c

# Белый
color7 #a89984
color15 #ffffff

# ============================================================================
# ГОРЯЧИЕ КЛАВИШИ ВНУТРИ ТЕРМИНАЛА
# ============================================================================
# Изменение масштаба шрифта прямо на лету (Ctrl + Плюс / Минус)
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Копирование и вставка (Ctrl+Shift+C / V)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
